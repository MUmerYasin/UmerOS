# .github/workflows/ci.yml — H9 CI gate (implements §7)
# Jobs: tests+coverage · Ruff lint · Mypy type-check · secret scan · pre-commit
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Job 1: Tests + Coverage ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        # H9 / H16: execute the whole tests/ tree (unittest + quantum) via
        # pytest>=8 (the bundled/old pytest fails on the removed `imp` module).
        # `pythonpath = ["."]` is set in pyproject.toml so repo modules import.
        # Coverage floor is data-driven: measured 36% on 2026-08-26; set
        # conservatively and raised over time (§7 "start conservative").
        run: |
          python -m pytest tests/ \
            -q \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=30

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # ── Job 2: Lint (Ruff) ─────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff lint
        # TODO(H9): flip to blocking once the baseline is clean (tracked separately).
        continue-on-error: true
        run: ruff check . --output-format=github
      - name: Run Ruff format check
        continue-on-error: true
        run: ruff format --check .

  # ── Job 3: Type-check (Mypy) ────────────────────────────────────────────
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mypy
        run: pip install mypy
      - name: Run Mypy type-check
        # Warnings only for now; tighten (drop `|| true`) in later passes.
        continue-on-error: true
        run: mypy --ignore-missing-imports --no-error-summary . || true

  # ── Job 4: Secret scanning ─────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 5: Pre-commit hooks ─────────────────────────────────────────────
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        # TODO(H9): flip to blocking once the baseline is clean (tracked separately).
        continue-on-error: true
        uses: pre-commit/action@v3.0.1
