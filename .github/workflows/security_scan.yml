name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Fast baseline: run on every PR ────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # H9 / §7 / §9 H9: scope Bandit off the ~93k-file C reference tree
      # (Old Linux Code/), vendored libs, build dirs, tests and the Flutter UI.
      - name: Run Bandit (static security analysis, scoped)
        run: |
          pip install bandit
          bandit -r . \
            -x "Old Linux Code,node_modules,liboqs,build,dist,__pycache__,tests,ui" \
            -ll -f txt

      - name: Run Safety (dependency vulnerability check)
        run: |
          pip install safety
          safety check -r requirements.txt --full-report

      # ── Heavy / network scans: main/release only (§7) ─────────────────────
      - name: Run Trivy (container scanning)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@0.12.0
        with:
          image-ref: "docker.io/library/python:3.12-slim"
          format: "table"
          exit-code: "1"

      # ZAP §7: only meaningful when an API server actually runs in CI.
      # Gate to main, never block PRs, and drop the reference to a
      # non-existent zap-rules.tsv so the step does not error on a missing file.
      - name: Run OWASP ZAP baseline scan (API security, main only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: "http://localhost:8000"
